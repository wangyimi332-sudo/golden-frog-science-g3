name: Publish G3 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack G3 site
        shell: bash
        run: |
          cat package/g3-pages.zip.part* > "$RUNNER_TEMP/g3-pages.zip"
          echo "8041c8a63445814c0dceac636bddca5bec684860a4634c1dd849d553888359fd  $RUNNER_TEMP/g3-pages.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/g3-pages"
          unzip -q "$RUNNER_TEMP/g3-pages.zip" -d "$RUNNER_TEMP/g3-pages"
          test -f "$RUNNER_TEMP/g3-pages/public/index.html"
      - name: Add readable site files to repository
        shell: bash
        run: |
          cp -a "$RUNNER_TEMP/g3-pages/public" ./public
          git add public
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Materialize complete G3 site files'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
